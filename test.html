<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: Dumb Ways to Lose Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; }
  #test-bar {
    flex: none; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: #111111; color: #FFF8E7;
    font: 600 14px/1.2 system-ui, sans-serif;
  }
  #test-bar strong { color: #FFD23F; letter-spacing: 1px; }
  #test-bar select, #test-bar button { font: inherit; padding: 4px 8px; border-radius: 6px; border: 2px solid #FFF8E7; background: #222; color: #FFF8E7; }
  #test-bar button { cursor: pointer; }
  #t-log { margin-left: auto; font-family: 'Courier New', monospace; }
  #t-log .pass { color: #33FF88; } #t-log .fail { color: #FF5C5C; }
  #game-root { flex: 1; height: auto; }
</style>
</head>
<body>
<div id="test-bar">
  <strong>TEST MODE</strong>
  <label>Game <select id="t-game"></select></label>
  <label>Speed
    <select id="t-speed">
      <option>1</option><option>1.25</option><option>1.5</option><option>2</option><option>2.5</option>
    </select>
  </label>
  <button id="t-restart" type="button">Restart</button>
  <span id="t-log">Loops one game forever. Money never runs out.</span>
</div>
<div id="game-root"></div>

<script src="sound.js"></script>
<script src="input.js"></script>
<script src="engine.js"></script>
<script src="games/manifest.js"></script>

<script>
  const params = new URLSearchParams(location.search);
  const games = Game.list();
  const gameSel = document.getElementById('t-game');
  const speedSel = document.getElementById('t-speed');
  const log = document.getElementById('t-log');

  gameSel.innerHTML = games.map((g) => `<option value="${g.id}">${g.name || g.id}</option>`).join('');
  gameSel.value = params.get('game') || (games[0] && games[0].id);
  speedSel.value = params.get('speed') || '1';

  let passes = 0, fails = 0;
  function apply() {
    passes = fails = 0;
    history.replaceState(null, '', `?game=${gameSel.value}&speed=${speedSel.value}`);
    Game.test.restart({ gameId: gameSel.value, speed: Number(speedSel.value) });
    document.activeElement.blur(); // give arrow keys back to the game
  }
  gameSel.addEventListener('change', apply);
  speedSel.addEventListener('change', apply);
  document.getElementById('t-restart').addEventListener('click', apply);

  Game.boot(document.getElementById('game-root'), {
    test: { gameId: gameSel.value, speed: Number(speedSel.value) },
    onResult(r) {
      r.pass ? passes++ : fails++;
      const why = r.timedOut ? ' (timed out)' : r.crashed ? ' (start() crashed, see console)' : '';
      log.innerHTML = `Last: <span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</span>${why} · ${passes} pass / ${fails} fail`;
    },
  });
</script>
</body>
</html>
